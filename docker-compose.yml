version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/lakehouse;
      mc mb -p local/raw;
      mc mb -p local/warehouse;
      exit 0;
      "

  metastore-db:
    image: postgres:15
    environment:
      POSTGRES_USER: metastore
      POSTGRES_PASSWORD: metastore
      POSTGRES_DB: metastore
    volumes:
      - ./data/metastore-db:/var/lib/postgresql/data

  hive-metastore:
    image: apache/hive:4.2.0
    depends_on:
      - metastore-db
    environment:
      SERVICE_NAME: metastore
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./data/lakehouse:/opt/lakehouse
    ports:
      - "9083:9083"

  spark:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    depends_on:
      - minio
      - hive-metastore
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./scripts:/opt/spark/scripts
      - ./spark:/opt/spark/app
      - ./data/lakehouse:/opt/lakehouse
      - ./data/tpch:/data/tpch:ro
      - ./lib:/opt/spark/jars-extra
    entrypoint: []
    command: ["/bin/sh", "-c", "tail -f /dev/null"]
