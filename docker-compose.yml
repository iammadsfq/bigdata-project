version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/lakehouse;
      mc mb -p local/raw;
      exit 0;
      "


  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      RAW_DATA_PATH: s3a://raw/tpch
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./spark:/opt/spark/app
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - ./data/lakehouse:/opt/lakehouse
    ports:
      - "10000:10000"
      - "4040:4040"
    entrypoint: []
    command: >
      /bin/sh -c "
      /opt/spark/sbin/start-thriftserver.sh
      && tail -f /dev/null
      "

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    ports:
      - "8080:8080"
    volumes:
      - ./:/work
      - ./.dbt:/root/.dbt
    working_dir: /work/dbt