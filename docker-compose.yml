services:
  minio:
    build:
      context: ./docker
      dockerfile: Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  minio-init:
    build:
      context: ./docker
      dockerfile: Dockerfile.minio
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      mc mb -p local/lakehouse;
      mc mb -p local/raw;
      exit 0;
      "

  spark:
    build:
      context: ./docker
      dockerfile: Dockerfile.spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      RAW_DATA_PATH: s3a://raw/tpch
      PYTHONPATH: /opt/spark/app
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./spark:/opt/spark/app
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
    ports:
      - "10000:10000"
      - "4040:4040"
    entrypoint: []
    command: >
      /bin/sh -c "
      /opt/spark/bin/spark-submit /opt/spark/app/ingest/load_tables.py --init-only
      && /opt/spark/sbin/start-thriftserver.sh
      && tail -f /dev/null
      "

  dbt:
    build:
      context: ./docker
      dockerfile: Dockerfile.dbt
    depends_on:
      - spark
    environment:
      DBT_PROFILES_DIR: /work/dbt
    ports:
      - "8080:8080"
    volumes:
      - ./:/work
    working_dir: /work/dbt
